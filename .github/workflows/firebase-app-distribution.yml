# Upload the current Android release APK to Firebase App Distribution.
#
# Triggers: workflow_dispatch, push to app-release-*, tags v* / app-release-*
# Scope: Android only.
# Release is not debuggable and must be signed with the Play upload key.
# Before flutter build apk --release, CI decodes ANDROID_KEYSTORE_BASE64 onto
# the runner and exports ANDROID_KEYSTORE_FILE as that absolute path (not
# base64), plus ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and
# ANDROID_KEY_PASSWORD. If any of those secrets is missing, the job fails.
# No debug-key fallback. Do not print the keystore, passwords, alias, or base64.
# Builds with --dart-define=API_BASE_URL=https://... (HTTPS required; see docs).
# See .github/firebase-app-distribution.md

name: Firebase App Distribution (Android)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes shown to testers in App Distribution
        required: false
        type: string
  push:
    branches:
      - 'app-release-*'
    tags:
      - 'v*'
      - 'app-release-*'

permissions:
  contents: read

jobs:
  android-distribute:
    name: Build and distribute Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if required Firebase secrets are missing
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          set -euo pipefail
          missing=0
          require_secret() {
            local name="$1"
            local value="$2"
            if [ -z "${value}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}. See .github/firebase-app-distribution.md"
              missing=1
            fi
          }
          require_secret FIREBASE_APP_ID "${FIREBASE_APP_ID}"
          require_secret FIREBASE_SERVICE_ACCOUNT "${FIREBASE_SERVICE_ACCOUNT}"
          if [ -z "${FIREBASE_TESTER_GROUPS}" ] && [ -z "${FIREBASE_TESTERS}" ]; then
            echo "::error::Set FIREBASE_TESTER_GROUPS (preferred) and/or FIREBASE_TESTERS. See .github/firebase-app-distribution.md"
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          echo "Required Firebase secrets are present."

      - name: Fail if required upload-key secrets are missing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          require_secret() {
            local name="$1"
            local value="$2"
            if [ -z "${value}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}. See .github/firebase-app-distribution.md"
              missing=1
            fi
          }
          require_secret ANDROID_KEYSTORE_BASE64 "${ANDROID_KEYSTORE_BASE64}"
          require_secret ANDROID_KEYSTORE_PASSWORD "${ANDROID_KEYSTORE_PASSWORD}"
          require_secret ANDROID_KEY_ALIAS "${ANDROID_KEY_ALIAS}"
          require_secret ANDROID_KEY_PASSWORD "${ANDROID_KEY_PASSWORD}"
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          echo "Required upload-key secrets are present."

      - name: Compose release notes
        env:
          DISPATCH_NOTES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_notes || '' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${DISPATCH_NOTES}" ]; then
            printf '%s\n' "${DISPATCH_NOTES}" > release-notes.txt
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            {
              echo "Release ${{ github.ref_name }}"
              git log -1 --pretty=%B
            } > release-notes.txt
          else
            git log -1 --pretty=%B > release-notes.txt
          fi
          echo "Release notes:"
          cat release-notes.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to this repo's .metadata (stable revision cc0734ac71 = Flutter 3.41.7 / Dart 3.11.5).
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      # Decode the Play upload keystore onto the runner. Do not enable command
      # tracing in this step: a trace would print ANDROID_KEYSTORE_BASE64.
      # Do not echo the keystore bytes, the base64, or the path.
      - name: Write upload keystore on the runner
        id: upload_keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::Missing required GitHub Actions secret: ANDROID_KEYSTORE_BASE64. See .github/firebase-app-distribution.md"
            exit 1
          fi
          if [ -z "${RUNNER_TEMP:-}" ] || [ ! -d "${RUNNER_TEMP}" ]; then
            echo "::error::RUNNER_TEMP is not a directory. Refusing to write the upload keystore elsewhere."
            exit 1
          fi
          umask 077
          keystore_dir="$(mktemp -d "${RUNNER_TEMP}/upload-keystore.XXXXXX")"
          chmod 700 "${keystore_dir}"
          keystore_path="${keystore_dir}/upload-keystore.jks"
          if ! printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"; then
            rm -rf "${keystore_dir}"
            echo "::error::ANDROID_KEYSTORE_BASE64 could not be decoded. See .github/firebase-app-distribution.md"
            exit 1
          fi
          chmod 600 "${keystore_path}"
          if [ ! -s "${keystore_path}" ]; then
            rm -rf "${keystore_dir}"
            echo "::error::Decoded upload keystore is empty. See .github/firebase-app-distribution.md"
            exit 1
          fi
          printf 'keystore_path=%s\n' "${keystore_path}" >> "${GITHUB_OUTPUT}"
          echo "Upload keystore written on the runner."

      - name: Build release APK
        env:
          # Public production API. Optional repo Variable API_BASE_URL overrides.
          # Must stay HTTPS: lib/main.dart calls ApiConfig.ensureSafeBaseUrl()
          # before runApp, and release builds throw StateError on http://.
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://meu-agente-de-emprego.onrender.com' }}
          # Absolute path from the previous step. Not the base64 secret.
          ANDROID_KEYSTORE_FILE: ${{ steps.upload_keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Gradle reads these when android/key.properties is absent.
          # ANDROID_KEYSTORE_FILE must be a filesystem path. No debug-key fallback.
          if [ -z "${ANDROID_KEYSTORE_FILE}" ] || [ ! -f "${ANDROID_KEYSTORE_FILE}" ]; then
            echo "::error::ANDROID_KEYSTORE_FILE is not a file on the runner. Release signing has no debug-key fallback."
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "::error::Upload-key secret missing (ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, or ANDROID_KEY_PASSWORD). Release signing has no debug-key fallback. See .github/firebase-app-distribution.md"
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          case "${API_BASE_URL}" in
            https://*)
              host="${API_BASE_URL#https://}"
              host="${host%%/*}"
              if [ -z "${host}" ]; then
                echo "::error::API_BASE_URL must include a host. Got: ${API_BASE_URL}"
                exit 1
              fi
              ;;
            *)
              echo "::error::API_BASE_URL must be HTTPS for App Distribution release APKs (ApiConfig.ensureSafeBaseUrl). Got: ${API_BASE_URL}"
              exit 1
              ;;
          esac
          flutter build apk --release --dart-define="API_BASE_URL=${API_BASE_URL}"

      - name: Confirm APK exists
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "${apk}" ]; then
            echo "::error::Expected APK not found at ${apk}"
            exit 1
          fi
          ls -lh "${apk}"

      - name: Authenticate to Google Cloud (Firebase)
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          args=(
            "${apk}"
            --app "${FIREBASE_APP_ID}"
            --release-notes-file release-notes.txt
          )
          if [ -n "${FIREBASE_TESTER_GROUPS}" ]; then
            args+=(--groups "${FIREBASE_TESTER_GROUPS}")
          fi
          if [ -n "${FIREBASE_TESTERS}" ]; then
            args+=(--testers "${FIREBASE_TESTERS}")
          fi
          firebase --non-interactive appdistribution:distribute "${args[@]}"
